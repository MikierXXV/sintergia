<!doctype html>
<html lang="es" data-tema="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sintergia</title>
    <meta name="description" content="Los conceptos de Jacobo Grinberg y lo que se sabe de ellos" />

    <!--
      Se precarga solo la tipografía de interfaz. La de los titulares llega un instante después y el
      texto ya se está leyendo con la de respaldo: precargarlo todo compite con lo que de verdad
      bloquea la primera pantalla.
    -->
    <link rel="preload" href="/fuentes/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      El tema se resuelve ANTES de pintar, en un script síncrono en línea. Si se deja para el módulo
      principal, el navegador pinta primero el tema claro y luego lo cambia: es el destello blanco
      que se ve al entrar en un sitio oscuro. No se puede arreglar con CSS porque la preferencia
      guardada solo existe en JavaScript.
    -->
    <script>
      (() => {
        const guardado = localStorage.getItem('tema');
        const oscuro = guardado ? guardado === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
      })();
    </script>
  </head>
  <body>
    <div id="cabecera"></div>
    <main id="sitio"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
